<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDM</title>
    <link rel="stylesheet" href="styles.css">
    <script src="themeLoader.js"></script>
</head>
<body>
    <div class="notebook-page">
        <!-- Header Section -->
        <header class="header-section">
            <h1>This week</h1>
            <nav class="header-nav">
                <div class="menu-bubble">
                    <div class="menu-icon">⋮</div>
                    <div class="menu-dropdown">
                        <a href="index.html" class="menu-item">Home</a>
                        <a href="lists.html" class="menu-item">Lists</a>
                        <a href="thisweek.html" class="menu-item">This Week</a>
                        <a href="account.html" class="menu-item">Account</a>
                    </div>
                </div>
            </nav>
        </header>

        <!-- Main Content Area -->
        <div class="main-content">
            <div class="home-task-list">
                <h2>Your Tasks for This Week:</h2>
                <div id="week-tasks-list" class="week-tasks-list"></div>
                <!-- Tasks will be dynamically added here -->
            </div>
            <div class="right-sectionH">
            <!-- Left Section: Selected Text Display -->
                <div class="text-display-section">
                    <div class="text-display-box">
                        <div class="text-display-top">
                            <button id="random-task-btn" class="btn-random-task">Random task:</button>
                        </div>
                        <p id="selected-text">No task selected yet. Use the buttons below to get started!</p>
                        <div class="list-selector">
                            <button id="list-select-btn" class="list-select-btn">▼</button>
                            <div id="list-dropdown" class="list-dropdown"></div>
                        </div>
                    </div>
                </div>

                <!-- Countdown Timer -->
                <div class="timer-section" class="text-display-section">
                    <div class="timer-display" id="timer-display-container">
                        <input type="text" id="timer-input" class="timer-input" value="25:00" pattern="[0-9]{1,3}:[0-9]{2}" maxlength="6">
                    </div>
                    <div class="timer-controls">
                        <button id="start-btn" class="btn-start">➮</button>
                        <button id="stop-btn" class="btn-stop" disabled>■</button>
                        <button id="reset-btn" class="btn-reset">↻</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="globalVars.js"></script>
    <script src="script.js"></script>
</body>
</html>
